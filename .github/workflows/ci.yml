name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
  static:
    # A static x86_64 Linux binary for boot scripts on fresh GPU boxes;
    # attached to the GitHub release on a `v*` tag.
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup toolchain install stable --profile minimal && rustup target add x86_64-unknown-linux-musl
      - run: cargo build --release --target x86_64-unknown-linux-musl -p weights-cli
      - run: |
          cp target/x86_64-unknown-linux-musl/release/weights weights-x86_64-linux
          ./weights-x86_64-linux --version
      - uses: actions/upload-artifact@v4
        with:
          name: weights-x86_64-linux
          path: weights-x86_64-linux
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" weights-x86_64-linux --title "$GITHUB_REF_NAME" --notes "Static x86_64 Linux build of the weights CLI."
